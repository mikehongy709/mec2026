<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RemnantMonitor | Mission telemetry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/css/tabler.min.css" />
  <style>
    :root { --tblr-primary: #4cc9f0; --tblr-primary-rgb: 76, 201, 240; }
    body { background: #070b1f; }
    .card { background: #0d1433; border-color: #1f2d6b; }
    .navbar { background: #0a1030; border-bottom: 1px solid #1f2d6b; }
    .big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stale .big { opacity: .4; }
    .spark { width: 100%; height: 40px; }
    .spark polyline { fill: none; stroke: var(--tblr-primary); stroke-width: 2; }
    .stale .spark polyline { stroke: var(--tblr-warning); stroke-dasharray: 4 3; }
    .replaying .spark polyline { stroke: var(--tblr-info); }
    .phase-btn.active { background: var(--tblr-primary); color: #041022; }
  </style>
</head>
<body>
<div class="page">
  <header class="navbar navbar-expand-md"><div class="container-xl">
    <span class="navbar-brand fw-bold">RemnantMonitor</span>
    <div class="ms-auto d-flex gap-3"><span class="text-secondary">Phase clock</span><span class="fw-bold" id="met"></span></div>
  </div></header>

  <div class="page-wrapper"><div class="container-xl py-4">
    <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
      <div class="btn-group" id="phases">
        <button class="btn phase-btn active" data-p="prelaunch">Pre-launch</button>
        <button class="btn phase-btn" data-p="ascent">Ascent</button>
        <button class="btn phase-btn" data-p="orbit">Orbit</button>
        <button class="btn phase-btn" data-p="reentry">Re-entry</button>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
        <span class="status-dot status-dot-animated" id="linkDot"></span><span id="linkText"></span>
        <label class="form-check form-switch m-0 ms-2"><input class="form-check-input" type="checkbox" id="corrupt"><span class="form-check-label">Inject corrupt packets</span></label>
        <button class="btn btn-outline-warning" id="dropBtn"></button>
      </div>
    </div>

    <div class="alert alert-warning d-none" id="banner"></div>
    <div class="row row-cards mb-4" id="tiles"></div>

    <div class="row row-cards">
      <div class="col-lg-6"><div class="card h-100">
        <div class="card-header"><h3 class="card-title">Checklist</h3>
          <div class="card-actions"><button class="btn btn-primary btn-sm d-none" id="launch">Authorize launch</button></div></div>
        <div class="list-group list-group-flush" id="checklist"></div>
        <div class="card-footer text-secondary small">Commands take 2.6 s round trip (1.3 s one-way light delay) and queue while the link is down.</div>
      </div></div>
      <div class="col-lg-3"><div class="card h-100">
        <div class="card-header"><h3 class="card-title">Alerts</h3></div>
        <div class="list-group list-group-flush" id="alerts"></div>
      </div></div>
      <div class="col-lg-3"><div class="card h-100">
        <div class="card-header"><h3 class="card-title">Packet integrity</h3></div>
        <div class="card-body" id="stats"></div>
      </div></div>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/js/tabler.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const HOST = new URLSearchParams(location.search).get("api") || "localhost:8000";
// Nothing below is data: metrics, checklists, limits and packets all come from the backend.
let DELAY = 1.3, M = [], LISTS = {}, LIM = {}, NOTE = {}, PRS = {}, ws;
const S = { phase: "prelaunch", t0: Date.now(), manual: false, bo: false, link: true, replaying: false, ready: false, online: false,
            acc: 0, rej: 0, last: Date.now(), cmd: {} };
const buf = [], hist = {}, win = {}, cur = {};

async function loadConfig() {
  try {
    const c = await (await fetch(`http://${HOST}/api/config`)).json();
    DELAY = c.delay; M = c.metrics;
    for (const [id, ph] of Object.entries(c.phases)) { LISTS[id] = ph.checklist; LIM[id] = ph.limits; NOTE[id] = ph.notices || {}; PRS[id] = ph.prs_label; }
    M.forEach(m => { hist[m.k] = Array(40).fill(0); win[m.k] = []; });
    S.ready = true; connect();
  } catch { setTimeout(loadConfig, 2000); }
  updateLink();
}
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
function connect() {
  ws = new WebSocket(`ws://${HOST}/ws`);
  ws.onopen = () => { S.online = true; updateLink(); send({ type: "phase", phase: S.phase });
    send({ type: "corrupt", on: $("corrupt").checked }); };
  ws.onmessage = e => route(JSON.parse(e.data));
  ws.onclose = () => { S.online = false; updateLink(); setTimeout(connect, 2000); };
}

// Same checksum the server computes: values rounded to 2 dp.
const crc = p => Math.round(p.alt * 10 + p.vel * 1000 + p.g * 100 + p.tmp * 10 + p.pwr * 10 + p.prs * 10 + p.seq) % 65521;

function updateLink() {
  const up = !S.manual && !S.bo;
  if (up && !S.link && buf.length) startReplay();
  S.link = up;
  $("linkDot").className = "status-dot status-dot-animated " + (!S.online ? "bg-secondary" : up ? "bg-success" : "bg-danger");
  $("linkText").textContent = !S.online ? `Backend offline (${HOST}), retrying` : up ? `Link stable, ${DELAY}s one-way delay` : (S.bo ? "Plasma blackout" : "Link lost");
  $("dropBtn").textContent = S.manual ? "Restore link" : "Simulate comms dropout";
}
function startReplay() {
  S.replaying = true;
  const id = setInterval(() => {
    for (let i = 0; i < 12 && buf.length; i++) ingest(buf.shift());
    if (!buf.length) { clearInterval(id); S.replaying = false; }
  }, 60);
}
function route(pkt) {
  if (pkt.bo !== S.bo) { S.bo = pkt.bo; updateLink(); }   // blackout windows are decided by the backend
  if (!S.link || S.replaying) { buf.push(pkt); if (buf.length > 300) buf.shift(); } else ingest(pkt);
}
function ingest(p) {
  const ok = p.crc === crc(p) && M.every(m => Number.isFinite(p[m.k]));
  if (!ok) { S.rej++; return; }       // corrupted: dropped before it can touch charts or alerts
  S.acc++; S.last = Date.now();
  M.forEach(m => {
    const w = win[m.k]; w.push(p[m.k]); if (w.length > 5) w.shift();
    cur[m.k] = w.reduce((a, b) => a + b, 0) / w.length;  // moving average smoothing
    hist[m.k].push(cur[m.k]); hist[m.k].shift();
  });
}

function cmdStatus(c) {
  if (c.sentAt === null) return ["Queued, no link", "warning"];
  const el = (Date.now() - c.sentAt) / 1000;
  return el < .4 ? ["Sent", "secondary"] : el < DELAY * 2 ? ["In transit", "info"] : ["Confirmed", "success"];
}
const confirmed = ph => LISTS[ph].filter((_, i) => { const c = S.cmd[ph + i]; return c && c.v && cmdStatus(c)[0] === "Confirmed"; }).length;

function setPhase(ph) {
  S.phase = ph; S.t0 = Date.now(); S.bo = false; updateLink(); send({ type: "phase", phase: ph });
  document.querySelectorAll(".phase-btn").forEach(b => b.classList.toggle("active", b.dataset.p === ph));
  M.forEach(m => win[m.k] = []);
}

function render() {
  const b = $("banner");
  if (!S.ready) { b.className = "alert alert-secondary d-block"; b.textContent = `Waiting for the backend at ${HOST}. Start it with: uvicorn server:app --port 8000`; return; }
  const now = Date.now(), age = Math.round((now - S.last) / 1000), ph = S.phase;
  Object.values(S.cmd).forEach(c => { if (c.sentAt === null && S.link) c.sentAt = now; });
  const p = Math.floor((now - S.t0) / 1000), pad = n => String(n).padStart(2, "0");
  $("met").textContent = `T+${pad(Math.floor(p / 60))}:${pad(p % 60)}`;

  $("tiles").innerHTML = M.map(m => {
    const v = cur[m.k] ?? 0, name = m.k === "prs" ? PRS[ph] : m.n, h = hist[m.k];
    const lo = Math.min(...h), rng = (Math.max(...h) - lo) || 1;
    const pts = h.map((y, i) => `${i / 39 * 120},${36 - (y - lo) / rng * 32}`).join(" ");
    const tag = !S.link ? `<span class="badge bg-warning-lt">STALE, last packet ${age}s ago</span>`
              : S.replaying ? `<span class="badge bg-info-lt">Replaying</span>` : "";
    return `<div class="col-sm-6 col-lg-4"><div class="card card-sm ${!S.link ? "stale" : S.replaying ? "replaying" : ""}"><div class="card-body">
      <div class="d-flex justify-content-between"><span class="text-secondary">${name}</span>${tag}</div>
      <div class="big">${v.toFixed(m.d)} <span class="fs-4 text-secondary">${m.u}</span></div>
      <svg class="spark" viewBox="0 0 120 40" preserveAspectRatio="none"><polyline points="${pts}"/></svg></div></div></div>`;
  }).join("");

  b.className = "alert d-block " + (S.link ? "alert-info" : "alert-warning") + (S.link && !S.replaying ? " d-none" : "");
  b.textContent = !S.link ? `${S.bo ? "Plasma blackout" : "Communications lost"}. Showing last known values; ${buf.length} packets buffered on the vehicle.`
                          : `Link restored. Replaying ${buf.length} buffered packets onto the charts.`;

  const ckHtml = LISTS[ph].map((t, i) => {
    const k = ph + i, c = S.cmd[k];
    let st = c ? cmdStatus(c) : ["Not complete", "secondary"];
    if (c && !c.v && st[0] === "Confirmed") st = ["Not complete", "secondary"];
    return `<label class="list-group-item d-flex gap-3 align-items-center">
      <input type="checkbox" class="form-check-input m-0" data-k="${k}" ${c && c.v ? "checked" : ""}><span class="flex-fill">${t}</span>
      <span class="badge bg-${st[1]}-lt">${st[0]}</span></label>`;
  }).join("");
  if (ckHtml !== S.ckHtml) { S.ckHtml = ckHtml; $("checklist").innerHTML = ckHtml; }
  const n = confirmed(ph), need = LISTS[ph].length;
  $("launch").classList.toggle("d-none", ph !== "prelaunch");
  $("launch").disabled = n < need;
  $("launch").textContent = n < need ? `Launch locked (${n}/${need} confirmed)` : "Authorize launch";

  const A = [];
  if (S.bo) A.push(["warning", "Plasma blackout: telemetry interrupted"]);
  else if (!S.link) A.push(["warning", "Comms lost: values are stale"]);
  for (const k in NOTE[ph]) if (cur[k] > NOTE[ph][k][0]) A.push(["info", NOTE[ph][k][1]]);
  for (const k in LIM[ph]) { const [lo, hi] = LIM[ph][k], v = cur[k];
    if (v < lo || v > hi) A.push(["danger", `${M.find(m => m.k === k).n} ${v.toFixed(1)} outside ${lo} to ${hi}`]); }
  $("alerts").innerHTML = A.length ? A.map(a => `<div class="list-group-item"><span class="badge bg-${a[0]} me-2">${a[0] === "danger" ? "Limit" : a[0] === "warning" ? "Comms" : "Info"}</span>${a[1]}</div>`).join("")
    : `<div class="list-group-item text-secondary">No alerts. Values are within limits.</div>`;

  $("stats").innerHTML = `<div class="d-flex justify-content-between"><span class="text-secondary">Source</span><b>Python generator</b></div>
    <div class="d-flex justify-content-between"><span class="text-secondary">Accepted</span><b>${S.acc}</b></div>
    <div class="d-flex justify-content-between"><span class="text-secondary">Rejected (checksum)</span><b class="${S.rej ? "text-danger" : ""}">${S.rej}</b></div>
    <div class="d-flex justify-content-between"><span class="text-secondary">Buffered</span><b>${buf.length}</b></div>
    <div class="text-secondary small mt-3">Bad packets are dropped before smoothing, so injected spikes never trigger alerts.</div>`;
}

$("phases").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setPhase(b.dataset.p); });
$("checklist").addEventListener("change", e => {
  S.cmd[e.target.dataset.k] = { v: e.target.checked, sentAt: S.link ? Date.now() : null };
  render();
});
$("launch").addEventListener("click", () => setPhase("ascent"));
$("dropBtn").addEventListener("click", () => { S.manual = !S.manual; updateLink(); });
$("corrupt").addEventListener("change", e => send({ type: "corrupt", on: e.target.checked }));

updateLink(); setInterval(render, 250); loadConfig();
</script>
</body>
</html>
