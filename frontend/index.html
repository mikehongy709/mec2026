<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RemnantMonitor | Mission telemetry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/css/tabler.min.css" />
  <style>
    :root { --tblr-primary: #4cc9f0; --tblr-primary-rgb: 76, 201, 240; }
    body { background: #070b1f; }
    .card { background: #0d1433; border-color: #1f2d6b; }
    .navbar { background: #0a1030; border-bottom: 1px solid #1f2d6b; }
    .big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stale .big { opacity: .45; }
    .stale-tag { display: none; }
    .stale .stale-tag { display: inline-block; }
    .spark { width: 100%; height: 40px; }
    .spark polyline { fill: none; stroke: var(--tblr-primary); stroke-width: 2; }
    .stale .spark polyline { stroke: var(--tblr-warning); stroke-dasharray: 4 3; }
    .phase-btn.active { background: var(--tblr-primary); color: #041022; }
  </style>
</head>
<body>
  <div class="page">
    <header class="navbar navbar-expand-md">
      <div class="container-xl">
        <span class="navbar-brand fw-bold">RemnantMonitor</span>
        <div class="ms-auto d-flex align-items-center gap-3">
          <span class="text-secondary">Mission clock</span>
          <span class="fw-bold" id="met">T+00:00:00</span>
        </div>
      </div>
    </header>

    <div class="page-wrapper"><div class="container-xl py-4">

      <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
        <div class="btn-group" id="phases">
          <button class="btn phase-btn" data-p="prelaunch">Pre-launch</button>
          <button class="btn phase-btn" data-p="ascent">Ascent</button>
          <button class="btn phase-btn active" data-p="orbit">Orbit</button>
          <button class="btn phase-btn" data-p="reentry">Re-entry</button>
        </div>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="status-dot status-dot-animated bg-success" id="linkDot"></span>
          <span id="linkText">Link stable</span>
          <button class="btn btn-outline-warning ms-2" id="dropBtn">Simulate comms dropout</button>
        </div>
      </div>

      <div class="alert alert-warning d-none" id="staleBanner">
        Communications lost. Showing last known values; updates resume when the link returns.
      </div>

      <div class="row row-cards mb-4" id="tiles"></div>

      <div class="row row-cards">
        <div class="col-lg-7">
          <div class="card h-100">
            <div class="card-header">
              <h3 class="card-title">Checklist</h3>
              <div class="card-actions"><span class="badge bg-primary-lt" id="checkCount"></span></div>
            </div>
            <div class="list-group list-group-flush" id="checklist"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card h-100">
            <div class="card-header"><h3 class="card-title">Alerts</h3></div>
            <div class="list-group list-group-flush" id="alerts">
              <div class="list-group-item text-secondary">No alerts. Values are within limits.</div>
            </div>
          </div>
        </div>
      </div>

    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/js/tabler.min.js"></script>
  <script>
    // Simulated data. Replace tick() with a feed from your telemetry API or WebSocket.
    const LIGHT_DELAY_S = 1.3; // example one-way delay (Earth to Moon)
    const metrics = [
      { id: "alt",  name: "Altitude",         unit: "km",   v: 408,  step: 0.4,  min: 395, max: 420 },
      { id: "vel",  name: "Velocity",         unit: "km/s", v: 7.66, step: 0.01, min: 7.5, max: 7.8 },
      { id: "cab",  name: "Cabin pressure",   unit: "kPa",  v: 101,  step: 0.5,  min: 96,  max: 104 },
      { id: "pwr",  name: "Battery charge",   unit: "%",    v: 82,   step: 1.2,  min: 25,  max: 100 },
      { id: "tmp",  name: "Hull temperature", unit: "°C",   v: 21,   step: 0.8,  min: -10, max: 35 },
      { id: "o2",   name: "Oxygen reserve",   unit: "%",    v: 94,   step: 0.3,  min: 30,  max: 100 }
    ];
    const history = {}; metrics.forEach(m => history[m.id] = Array(30).fill(m.v));
    const lists = {
      prelaunch: ["Fuel loaded and sealed", "Range safety cleared", "Crew suit checks complete", "Launch window confirmed"],
      ascent:    ["Max-Q passed", "Stage separation confirmed", "Fairing jettison", "Orbital insertion burn"],
      orbit:     ["Solar arrays deployed", "Antenna pointing verified", "Daily system diagnostics", "Crew exercise logged"],
      reentry:   ["Deorbit burn planned", "Heat shield inspected", "Landing zone weather checked", "Recovery team on station"]
    };
    const state = { phase: "orbit", link: true, checks: {}, start: Date.now(), alerts: [] };
    const $ = id => document.getElementById(id);

    function tiles() {
      $("tiles").innerHTML = metrics.map(m => `
        <div class="col-sm-6 col-lg-4"><div class="card card-sm" id="t-${m.id}"><div class="card-body">
          <div class="d-flex justify-content-between"><span class="text-secondary">${m.name}</span>
            <span class="badge bg-warning-lt stale-tag">Last known</span></div>
          <div class="big"><span class="val"></span> <span class="fs-4 text-secondary">${m.unit}</span></div>
          <svg class="spark" viewBox="0 0 120 40" preserveAspectRatio="none"><polyline points=""></polyline></svg>
        </div></div></div>`).join("");
    }

    function draw() {
      state.alerts = [];
      metrics.forEach(m => {
        const t = $("t-" + m.id);
        t.querySelector(".val").textContent = m.v.toFixed(m.step < 0.1 ? 2 : 1);
        const h = history[m.id], lo = Math.min(...h), hi = Math.max(...h) || 1, rng = hi - lo || 1;
        t.querySelector("polyline").setAttribute("points",
          h.map((y, i) => `${(i / (h.length - 1)) * 120},${36 - ((y - lo) / rng) * 32}`).join(" "));
        t.classList.toggle("stale", !state.link);
        if (m.v < m.min || m.v > m.max) state.alerts.push(`${m.name} is ${m.v.toFixed(1)} ${m.unit}, outside ${m.min} to ${m.max}`);
      });
      $("alerts").innerHTML = state.alerts.length
        ? state.alerts.map(a => `<div class="list-group-item"><span class="badge bg-danger me-2">Out of range</span>${a}</div>`).join("")
        : `<div class="list-group-item text-secondary">No alerts. Values are within limits.</div>`;
    }

    function tick() {
      if (!state.link) { draw(); return; } // hold last known values during dropout
      metrics.forEach(m => {
        m.v += (Math.random() - 0.5) * 2 * m.step;
        history[m.id].push(m.v); history[m.id].shift();
      });
      draw();
    }

    function checklist() {
      const items = lists[state.phase];
      $("checklist").innerHTML = items.map((t, i) => {
        const k = state.phase + i;
        return `<label class="list-group-item d-flex gap-3 align-items-center">
          <input type="checkbox" class="form-check-input m-0" data-k="${k}" ${state.checks[k] ? "checked" : ""}>
          <span>${t}</span></label>`;
      }).join("");
      const done = items.filter((_, i) => state.checks[state.phase + i]).length;
      $("checkCount").textContent = `${done} of ${items.length} complete`;
    }

    function setLink(up) {
      state.link = up;
      $("linkDot").className = "status-dot status-dot-animated " + (up ? "bg-success" : "bg-danger");
      $("linkText").textContent = up ? `Link stable, ${LIGHT_DELAY_S}s one-way delay` : "Link lost";
      $("staleBanner").classList.toggle("d-none", up);
      $("dropBtn").textContent = up ? "Simulate comms dropout" : "Restore link";
      draw();
    }

    $("phases").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      state.phase = b.dataset.p;
      document.querySelectorAll(".phase-btn").forEach(x => x.classList.toggle("active", x === b));
      checklist();
    });
    $("checklist").addEventListener("change", e => {
      state.checks[e.target.dataset.k] = e.target.checked; checklist();
    });
    $("dropBtn").addEventListener("click", () => setLink(!state.link));

    setInterval(() => {
      const s = Math.floor((Date.now() - state.start) / 1000), p = n => String(n).padStart(2, "0");
      $("met").textContent = `T+${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
    }, 1000);
    setInterval(tick, 1000);

    tiles(); checklist(); setLink(true); tick();
  </script>
</body>
</html>
