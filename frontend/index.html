<html lang="en" data-bs-theme="dark">
<head>

  <title>RemnantMonitor | Mission telemetry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/css/tabler.min.css" />
  <style>
    :root { --tblr-primary: #4cc9f0; --tblr-primary-rgb: 76, 201, 240; }
    body { background: #070b1f; }
    .card { background: #0d1433; border-color: #1f2d6b; }
    .navbar { background: #0a1030; border-bottom: 1px solid #1f2d6b; }
    .big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stale .big { opacity: .4; }
    .spark { width: 100%; height: 40px; }
    .spark polyline { fill: none; stroke: var(--tblr-primary); stroke-width: 2; }
    .stale .spark polyline { stroke: var(--tblr-warning); stroke-dasharray: 4 3; }
    .replaying .spark polyline { stroke: var(--tblr-info); }
    .phase-btn.active { background: var(--tblr-primary); color: #041022; }
  </style>
</head>

<div class="page">
  <header class="navbar navbar-expand-md"><div class="container-xl">
    <span class="navbar-brand fw-bold">RemnantMonitor</span>

        <button class="btn phase-btn" data-p="ascent">Ascent</button>
        <button class="btn phase-btn" data-p="orbit">Orbit</button>
        <button class="btn phase-btn" data-p="reentry">Re-entry</button>

      <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">

        <button class="btn btn-outline-warning" id="dropBtn"></button>
      </div>
    </div>

    <div class="alert alert-warning d-none" id="banner"></div>
    <div class="row row-cards mb-4" id="tiles"></div>

        <div class="card-header"><h3 class="card-title">Alerts</h3></div>

        <div class="card-body" id="stats"></div>
      </div></div>
    </div>
  </div></div>
</div>
